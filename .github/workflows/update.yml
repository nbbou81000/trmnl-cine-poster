name: Update movie pool

on:
  schedule:
    - cron: "0 5 * * *"   # tous les jours à 5h UTC → nouveau pool quotidien
  workflow_dispatch:        # lancement manuel possible

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch TMDB pool
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node src/fetch-movies.js

      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-fr.json data-en.json
          git diff --cached --quiet || git commit -m "🎬 Pool du $(date -u +%F) [skip ci]"
          git push
